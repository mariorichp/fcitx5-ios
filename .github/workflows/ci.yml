name: ci

on:
  push:
    branches:
      - master
      - ios-16.1-rebase
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install clang-format swift-format

      - name: Lint
        run: ./scripts/lint.sh

  data:
    runs-on: ubuntu-24.04
    steps:
      - name: Build rime-ice
        uses: rimeinn/deploy-schema@master
        with:
          user-recipe-list: |-
            iDvel/rime-ice:others/recipes/full
          shared-recipe-list:
          package-items: |-
            build
            lua
            opencc
            custom_phrase.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact.zip
          path: |
            /tmp/deploy-schema/artifact.zip

  build:
    needs: [lint, data]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: SIMULATORARM64 }
          - { platform: SIMULATOR64 }
          - { platform: OS64 }

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.4

      - name: Install dependencies
        run: |
          brew install librsvg
          ./scripts/install-deps.sh ${{ matrix.platform }}
          curl -LO https://github.com/fcitx-contrib/fcitx5-prebuilder/releases/download/macos/marisa-arm64.tar.bz2
          sudo tar xf marisa-arm64.tar.bz2 -C /usr/local bin/marisa-build

      - name: Build
        run: |
          git apply --directory=fcitx5 patches/fcitx5.patch
          git apply --directory=deps/swifter patches/swifter.patch
          git apply --directory=engines/libime/src/libime/core/kenlm patches/kenlm.patch
          git apply --directory=engines/fcitx5-hallelujah patches/hallelujah.patch
          git apply --directory=engines/fcitx5-rime patches/rime.patch
          if [[ "${{ matrix.platform }}" == "OS64" ]]; then
            cmake -B build/${{ matrix.platform }} -G Xcode \
              -DPLATFORM=${{ matrix.platform }}
            cmake --build build/${{ matrix.platform }} --config Release -- CODE_SIGNING_ALLOWED=NO
          else
            cmake -B build/${{ matrix.platform }} -G Xcode \
              -DPLATFORM=${{ matrix.platform }}
            cmake --build build/${{ matrix.platform }} --config Release
          fi

      - name: Check validity
        run: |
          ./scripts/check-validity.sh ${{ matrix.platform }}

      - name: Verify iOS 16.3+ libc++ symbols are handled
        if: ${{ matrix.platform == 'OS64' }}
        run: |
          set -e
          APP=build/OS64/src/Release-iphoneos/Fcitx5.app
          FAIL=0
          while IFS= read -r bin; do
            # to_chars(float/double/long double) — iOS 16.3+ only. Must be
            # weak-imported (never called at runtime) or absent.
            strong_tc=$(nm -m "$bin" 2>/dev/null | grep -E "to_chars.*[fdelm]NS_12chars_format|_ZNSt3__18to_charsEPcS0_[fde]" | grep -v "weak external" || true)
            if [ -n "$strong_tc" ]; then
              echo "FAIL: $bin has STRONG references to iOS 16.3+ to_chars symbols:"
              echo "$strong_tc"
              FAIL=1
            fi
            # __hash_memory — iOS 17+ only. Must be DEFINED LOCALLY by our
            # shim (common/libcxx_ios161_shim.cpp), not imported from libc++.
            # Otherwise every std::unordered_map<string,...> insert during
            # static init jumps to NULL → SIGSEGV before main().
            hm_import=$(nm -m "$bin" 2>/dev/null | grep "__ZNSt3__113__hash_memoryEPKvm" | grep "(undefined)" || true)
            if [ -n "$hm_import" ]; then
              echo "FAIL: $bin imports __hash_memory from libc++ (iOS 17+ only):"
              echo "$hm_import"
              echo "Shim common/libcxx_ios161_shim.cpp was not linked in."
              FAIL=1
            fi
          done < <(find "$APP" -type f -perm +111 ! -name "*.dylib" 2>/dev/null | xargs -I {} file {} | grep "Mach-O" | awk -F: '{print $1}')
          if [ "$FAIL" = "1" ]; then
            echo "iOS 16.1 compatibility check failed — app would crash on device"
            exit 1
          fi
          echo "OK: no unhandled iOS 16.3+ libc++ symbols"

      - name: Install
        if: ${{ matrix.platform == 'SIMULATORARM64' }}
        run: |
          xcrun simctl boot "iPhone 17"
          xcrun simctl install booted build/${{ matrix.platform }}/src/Release-iphonesimulator/Fcitx5.app
          xcrun simctl launch booted org.fcitx.Fcitx5

      - name: Download artifact
        if: ${{ matrix.platform == 'OS64' }}
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Pack IPA
        if: ${{ matrix.platform == 'OS64' }}
        working-directory: build/OS64/src/Release-iphoneos
        run: |
          # For developer test period use rime-ice.
          mv Fcitx5.app/PlugIns/Rime.appex/share/rime-data/opencc .
          rm -rf Fcitx5.app/PlugIns/Rime.appex/share/rime-data/*
          mv opencc Fcitx5.app/PlugIns/Rime.appex/share/rime-data
          tar xf ../../../../artifact.zip -C Fcitx5.app/PlugIns/Rime.appex/share/rime-data

          # Ad-hoc sign so entitlements are embedded in the Mach-O signature.
          # Without this, the bundle is unsigned — TrollStore's install-time
          # fakesign has no baseline to read App Group entitlements from, so
          # iOS 16.1 treats the keyboard extensions as entitlement-less and
          # omits them from third-party app keyboard pickers (WeChat, Xianyu
          # etc). System apps (Messages, Notes) use a more permissive path
          # and show the keyboard regardless, which is why the bug looks
          # app-specific. Sign children first, then the parent bundle.
          KB_ENT="$GITHUB_WORKSPACE/assets/keyboard.entitlements"
          APP_ENT="$GITHUB_WORKSPACE/assets/app.entitlements"
          for ext in Chinese Hallelujah Rime; do
            codesign --force --sign - --timestamp=none \
              --entitlements "$KB_ENT" \
              "Fcitx5.app/PlugIns/${ext}.appex"
          done
          codesign --force --sign - --timestamp=none \
            --entitlements "$APP_ENT" \
            "Fcitx5.app"

          # Verify all four binaries carry the App Group entitlement.
          for bundle in Fcitx5.app Fcitx5.app/PlugIns/Chinese.appex \
                        Fcitx5.app/PlugIns/Hallelujah.appex \
                        Fcitx5.app/PlugIns/Rime.appex; do
            if ! codesign -d --entitlements - "$bundle" 2>&1 | \
                grep -q "group.org.fcitx.Fcitx5"; then
              echo "FAIL: $bundle missing application-groups entitlement"
              codesign -d --entitlements - "$bundle" 2>&1 || true
              exit 1
            fi
          done
          echo "OK: all bundles signed with App Group entitlement"

          mkdir Payload
          cp -r Fcitx5.app Payload
          zip -r Fcitx5.ipa Payload

      - name: Upload artifact
        if: ${{ github.ref != 'refs/heads/master' && matrix.platform == 'OS64' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Fcitx5.ipa
          path: |
            build/OS64/src/Release-iphoneos/Fcitx5.ipa

      - name: Create Nightly release
        if: ${{ github.ref == 'refs/heads/master' && matrix.platform == 'OS64' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            build/OS64/src/Release-iphoneos/Fcitx5.ipa

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3

  compare:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    uses: ./.github/workflows/compare.yml
